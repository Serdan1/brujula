
# Brújula — Pipeline ML e informes PDF
#
# Ejecución manual:
# - Ejecuta el pipeline de inteligencia artificial.
# - Si publicar está activado, publica resultados
#   e informes PDF en Supabase.
#
# Ejecución automática en develop:
# - Ejecuta el pipeline sin publicar.
#
# Secretos necesarios:
# SUPABASE_URL
# SUPABASE_SERVICE_KEY

name: Pipeline ML

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar los resultados e informes en Supabase"
        type: boolean
        default: false

  push:
    branches: [develop]
    paths:
      - "ml/**"
      - "data/**"
      - "reports/**"
      - ".github/workflows/pipeline-ml.yml"

concurrency:
  group: pipeline-ml
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ml

    steps:
      # 1. Descargar el repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt

      # 3. Instalar dependencias de IA
      - name: Instalar dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      # 4. Instalar dependencias PDF
      - name: Instalar dependencias de informes PDF
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            fonts-dejavu-core

          pip install -r reports/requirements.txt

      # 5. Preparar datos
      - name: Generar las tablas (UCI + ampliación sintética)
        working-directory: .
        run: |
          mkdir -p data/raw
          cp ml/data/raw/student-*.csv data/raw/
          python data/prepare_uci.py
          python data/extend.py

      # 6. Generar variables
      - name: Variables
        run: python features.py

      # 7. Ejecutar modelos de referencia
      - name: Modelos de referencia
        run: python baselines.py

      # 8. Ejecutar red neuronal
      - name: Red neuronal
        run: python model.py

      # 9. Comparar modelos
      - name: Comparar combinaciones
        run: python combinar.py

      # 10. Explicabilidad
      - name: Explicabilidad SHAP
        run: python explain.py

      # 11. Generar alertas
      - name: Alertas
        run: python alerts.py

      # 12. Publicar resultados
      - name: Publicar en Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python publish.py

      # 13. Generar y subir informes PDF
      - name: Generar y subir informes PDF
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        working-directory: .
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUBLICAR_INFORMES: "true"
        run: |
          echo "Generando informes de clase del periodo 1..."
          python reports/main.py --periodo 1
          echo "Generación y subida de informes finalizada."

      # 14. Guardar resultados
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ml-${{ github.run_number }}
          path: |
            ml/results/*.json
            ml/results/figures/
            ml/results/publicar/
          retention-days: 14
