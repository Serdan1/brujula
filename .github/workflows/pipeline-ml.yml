# Brújula — proceso completo de datos y modelos
# - Manual (Actions > Pipeline ML > Run workflow): ejecuta todo y, si se marca, publica en Supabase.
# - Automático al subir cambios a develop en ml/ o data/: ejecuta todo SIN publicar, para comprobar que nada se rompe.
# Secretos necesarios para publicar (Settings > Secrets and variables > Actions):
#   SUPABASE_URL y SUPABASE_SERVICE_KEY
name: Pipeline ML

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar los resultados en Supabase"
        type: boolean
        default: true
  push:
    branches: [develop]
    paths: ["ml/**", "data/**", ".github/workflows/pipeline-ml.yml"]

concurrency:
  group: pipeline-ml
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-ci.txt

      - name: Instalar dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Generar las tablas (UCI + ampliación sintética)
        working-directory: .
        run: |
          # Usa los CSV de la UCI ya incluidos en el repositorio para no depender de la web de la UCI
          mkdir -p data/raw && cp ml/data/raw/student-*.csv data/raw/
          python data/prepare_uci.py
          python data/extend.py

      - name: Variables
        run: python features.py

      - name: Modelos de referencia
        run: python baselines.py

      - name: Red neuronal
        run: python model.py

      - name: Comparar combinaciones
        run: python combinar.py

      - name: Explicabilidad SHAP
        run: python explain.py

      - name: Alertas
        run: python alerts.py

      - name: Publicar en Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python publish.py

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ml-${{ github.run_number }}
          path: |
            ml/results/*.json
            ml/results/figures/
            ml/results/publicar/
          retention-days: 14
